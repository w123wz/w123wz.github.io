山难越,谁悲失路之人,萍水相逢,尽是他乡之客,怀帝阍而不见,奉宣室以何年,嗟乎,时运不齐,命途多舛,冯唐易老,李广难封,屈贾谊于长沙,非无圣主,窜梁鸿于海曲,岂乏明时,所赖君子见机,达人知命,老当益壮,宁移白首之心,穷且益坚,不坠青云之志,酌贪泉而觉爽,处涸辙以犹欢,北海虽赊,扶摇可接,东隅已逝,桑榆非晚,孟尝高洁,空余报国之情,阮籍猖狂,岂效穷途之哭,勃,三尺微命,一介书生,无路请缨,等终军之弱冠,有怀投笔,慕宗悫之长风,舍簪笏于百龄,奉晨昏于万里,非谢家之宝树,接孟氏之芳邻,他日趋庭,叨陪鲤对,今兹捧袂,喜托龙门,杨意不逢,抚凌云而自惜,钟期既遇,奏流水以何惭,呜呼,胜地不常,盛筵难再,兰亭已矣,梓泽丘墟,临别赠言,幸承恩于伟饯,登高作赋,是所望于群公,敢竭鄙怀,恭疏短引,一言均赋,四韵俱成,请洒潘江,各倾陆海云尔,赤壁赋,壬戌之秋,七月既望,苏子与客泛舟游于赤壁之下,清风徐来,水波不兴,举酒属客,诵明月之诗,歌窈窕之章,少焉,月出于东山之上,徘徊于斗牛之间,白露横江,水光接天,纵一苇之所如,凌万顷之茫然,浩浩乎如冯虚御风,而不知其所止,飘飘乎如遗世独立,羽化而登仙,于是饮酒乐甚,扣舷而歌之,歌曰,桂棹兮兰桨,击空明兮溯流光,渺渺兮予怀,望美人兮天一方,客有吹洞箫者,倚歌而和之,其声呜呜然,如怨如慕,如泣如诉,余音袅袅,不绝如缕,舞幽壑之潜蛟,泣孤舟之嫠妇,苏子愀然,正襟危坐,而问客曰,何为其然也,客曰,月明星稀,乌鹊南飞,此非曹孟德之诗乎,西望夏口,东望武昌,山川相缪,郁乎苍苍,此非孟德之困于周郎者乎,方其破荆州,下江陵,顺流而东也,舳舻千里,旌旗蔽空,酾酒临江,横槊赋诗,固一世之雄也,而今安在哉,况吾与子渔樵于江渚之上,侣鱼虾而友麋鹿,驾一叶之扁舟,举匏樽以相属,寄蜉蝣于天地,渺沧海之一粟,哀吾生之须臾,羡长江之无穷,挟飞仙以遨游,抱明月而长终,知不可乎骤得,托遗响于悲风,苏子曰,客亦知夫水与月乎,逝者如斯,而未尝往也,盈虚者如彼,而卒莫消长也,盖将自其变者而观之,则天地曾不能以一瞬,自其不变者而观之,则物与我皆无尽也,而又何羡乎,且夫天地之间,物各有主,苟非吾之所有,虽一毫而莫取,惟江上之清风,与山间之明月,耳得之而为声,目遇之而成色,取之无禁,用之不竭,是造物者之无尽藏也,而吾与子之所共适,客喜而笑,洗盏更酌,肴核既尽,杯盘狼籍,相与枕藉乎舟中,不知东方之既白" data-fontsize="15px" data-random="false" async="async"></script><script async data-pjax src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script><div id="local-search"><div class="search-dialog"><nav class="search-nav"><span class="search-dialog-title">搜索</span><i class="fas fa-spinner fa-pulse" id="loading-status" hidden="hidden"></i><button class="search-close-button"><i class="fas fa-times"></i></button></nav><div class="text-center" id="loading-database"><i class="fas fa-spinner fa-pulse"></i><span>  数据加载中</span></div><div class="local-search-input"><input placeholder="请输入搜索关键词" type="text"/></div><hr/><div id="local-search-results"></div><div class="ais-Pagination" id="local-search-pagination" style="display:none;"><ul class="ais-Pagination-list"></ul></div><div id="local-search-stats"></div></div><div id="search-mask"></div><script src="/js/search/local-search.js?v=5.7.0"></script></div></div><!-- hexo injector body_end start --><div class="js-pjax"><script a
